name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Deploy Client to Vercel ────────────────────────────────
  deploy-client:
    name: Deploy Client → Vercel
    runs-on: ubuntu-latest
    needs: [] # runs immediately; CI is a separate status check
    if: github.event_name == 'push'
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: client
          vercel-args: --prod

  # ── Deploy Server to Render / Railway (generic) ───────────
  deploy-server:
    name: Deploy Server
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma & Build
        run: |
          pnpm exec prisma generate
          pnpm exec tsc

      - name: Deploy via Render hook
        if: ${{ secrets.RENDER_DEPLOY_HOOK != '' }}
        run: curl -s "${{ secrets.RENDER_DEPLOY_HOOK }}"
